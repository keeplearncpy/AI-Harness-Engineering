# Doc Parser — Document Parsing & Structuring Agent

name: doc_parser
type: independent
description: Parses and structures documents (PRD, API docs, specs) into machine-readable format

input:
  type: file
  description: Document file to parse (markdown, pdf, docx, etc.)

output:
  type: json
  description: Structured representation of document content

trigger: on-demand
stateful: false
