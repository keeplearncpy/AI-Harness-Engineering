# Tester — Test Generation SubAgent

name: tester
type: subagent
description: Generates test cases and test reports from source code and FSD

input:
  type: multiple
  description: FSD document and generated source code
  required: true

output:
  type: code + markdown
  schema: skills/schemas/test_report.json
  targets:
    - workspace/{project}/tests/test-cases.md
    - workspace/{project}/tests/test-report.md

pipeline_role: phase_4
depends_on: [frontend_dev, backend_dev]
next: []
