# Data Modeler — Database Design SubAgent

name: data_modeler
type: subagent
description: Designs database schemas from functional specifications

input:
  type: markdown
  description: FSD document (SSD-SystemOverview.md)
  required: true

output:
  type: sql + markdown
  schema: skills/schemas/db_schema.json
  targets:
    - workspace/{project}/design/db-schema.sql
    - workspace/{project}/design/db-er-diagram.md
    - workspace/{project}/design/data-dictionary.md

pipeline_role: phase_2
depends_on: [fsd_generator]
next: [frontend_dev, backend_dev]
