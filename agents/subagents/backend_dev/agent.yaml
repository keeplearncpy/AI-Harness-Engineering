# Backend Dev — Backend Code Generation SubAgent

name: backend_dev
type: subagent
description: Generates backend code (FastAPI/Express) from FSD and DB schema

input:
  type: multiple
  description: FSD document and DB schema
  required: true

output:
  type: code
  target: workspace/{project}/src/backend/
  framework: fastapi

pipeline_role: phase_3
depends_on: [data_modeler]
next: [tester]
parallel_with: [frontend_dev]
