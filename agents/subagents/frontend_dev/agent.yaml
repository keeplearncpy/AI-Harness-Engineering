# Frontend Dev — Frontend Code Generation SubAgent

name: frontend_dev
type: subagent
description: Generates frontend code (React/Vue) from FSD and data models

input:
  type: multiple
  description: FSD document and DB schema
  required: true

output:
  type: code
  target: workspace/{project}/src/frontend/
  framework: react

pipeline_role: phase_3
depends_on: [data_modeler]
next: [tester]
parallel_with: [backend_dev]
