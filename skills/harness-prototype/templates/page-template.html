<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{页面标题}}</title>
  <link rel="stylesheet" href="assets/prototype.css">
</head>
<body>
  <!-- Top navigation menu (identical across pages, current page highlighted) -->
  <nav class="proto-nav">
    <a class="proto-brand" href="index.html">原型站点</a>
    <a class="proto-nav-link" href="index.html">首页</a>
    <a class="proto-nav-link" href="{{page-slug}}.html" aria-current="page">{{页面标题}}</a>
    <!-- Add more menu items per FSD -->
  </nav>

  <!-- Route bar: shows the current route of this page -->
  <div class="proto-route">路由: {{route}}</div>

  <main class="proto-main">
    <h1 class="proto-title">{{页面标题}}</h1>

    <!-- Wireframe block: content type label -->
    <section class="proto-block">
      <div class="proto-block-label">区块标题</div>
      <div class="proto-placeholder">{{内容占位说明}}</div>
    </section>

    <!-- Form block (when FSD requires) -->
    <section class="proto-block">
      <div class="proto-block-label">表单: {{表单名称}}</div>
      <form class="proto-form" action="{{submit-target}}" method="get">
        <label>字段1 <input type="text" name="field1" placeholder="占位提示"></label>
        <label>字段2 <select name="field2"><option>选项A</option></select></label>
        <button type="submit" class="proto-btn proto-btn-primary">提交</button>
      </form>
    </section>

    <!-- Button with real navigation to target page -->
    <a class="proto-btn" href="{{target-page}}.html">{{按钮文案}} →</a>

    <footer class="proto-footer">
      <a href="index.html">← 返回站点地图</a>
    </footer>
  </main>

  <script src="assets/prototype.js"></script>
</body>
</html>
