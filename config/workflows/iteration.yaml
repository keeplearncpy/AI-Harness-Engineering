# Iteration Workflow — Daily development iteration

name: iteration
description: Iterate on an existing project based on user feedback or new requirements

phases:
  - phase: 1
    name: context_loading
    action: load_state
    description: Load project state from .harness_state.json

  - phase: 2
    name: intent_parsing
    action: parse_intent
    description: Determine whether this is a feature addition, bug fix, or refactor

  - phase: 3
    name: feature_requirements
    agent: fsd_generator
    condition: intent == "feature_addition"
    input: user_query + existing_docs
    output:
      target: docs/feature-{feature_name}.md
      template: feature_doc.md

  - phase: 4
    name: code_generation
    parallel:
      - agent: frontend_dev
        condition: scope_includes_frontend
        input:
          - docs/feature-{feature_name}.md
          - src/frontend/
      - agent: backend_dev
        condition: scope_includes_backend
        input:
          - docs/feature-{feature_name}.md
          - src/backend/

  - phase: 5
    name: testing
    agent: tester
    depends_on: [code_generation]

  - phase: 6
    name: changelog_update
    action: update_changelog
    template: changelog.md

  - phase: 7
    name: state_update
    action: save_state
    description: Update .harness_state.json with new phase
