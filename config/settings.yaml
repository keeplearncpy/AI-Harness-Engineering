# Global settings for AI Harness Engineering

defaults:
  tech_stack:
    frontend: react
    backend: fastapi
    database: postgresql
    orm: sqlalchemy
  naming:
    snake_case: true
  language: zh-cn

agents:
  max_retries: 3
  timeout_seconds: 300

logging:
  level: INFO
  format: "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
